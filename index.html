<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Pro CRM | Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
        }
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    </script>
</head>
<body class="bg-slate-50 dark:bg-black min-h-[100dvh] flex items-center justify-center p-4 font-sans transition-colors">

    <div class="bg-white dark:bg-zinc-900 p-8 sm:p-10 rounded-3xl w-full max-w-md text-center shadow-2xl border border-slate-100 dark:border-zinc-800">
        <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-5 shadow-lg shadow-blue-500/30">
            <i class="fas fa-camera-retro"></i>
        </div>
        
        <h1 class="text-2xl font-black uppercase italic tracking-tighter text-slate-800 dark:text-white">
            Studio Pro <span class="text-blue-600 text-sm">v2</span>
        </h1>
        <p class="text-[11px] font-bold uppercase tracking-[0.2em] text-slate-400 mt-1 mb-8">
            Select Your Workspace
        </p>

        <div class="space-y-4">
            <a href="./admin.html" class="flex items-center justify-between p-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl shadow-lg shadow-blue-500/20 transition-all active:scale-95 group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-user-shield"></i>
                    </div>
                    <div class="text-left">
                        <p class="font-black text-sm uppercase tracking-wider">Admin Dashboard</p>
                        <p class="text-[10px] text-blue-100 font-medium">Manage clients, finance & staff</p>
                    </div>
                </div>
                <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
            </a>

            <a href="./employee.html" class="flex items-center justify-between p-4 bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 dark:hover:bg-zinc-700 text-slate-800 dark:text-white rounded-2xl transition-all active:scale-95 group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 rounded-xl flex items-center justify-center">
                        <i class="fas fa-laptop-code"></i>
                    </div>
                    <div class="text-left">
                        <p class="font-black text-sm uppercase tracking-wider">Employee Portal</p>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">Pick tasks & update work status</p>
                    </div>
                </div>
                <i class="fas fa-arrow-right text-slate-400 group-hover:translate-x-1 transition-transform"></i>
            </a>
        </div>

        <p class="mt-8 text-[10px] text-slate-400 font-bold uppercase tracking-widest italic">
            Real-Time Studio Management System
        </p>
    </div>

</body>
</html>
